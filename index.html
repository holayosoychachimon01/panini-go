<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>🏆 Panini GO - Engine v2.0</title>
    <style>
        :root { --p-blue: #0033A0; --p-gold: #FDB913; --bg: #0A0F1D; --text: #FFFFFF; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; }
        
        /* Sistema de Rejilla de Alto Rendimiento */
        .app-grid { display: grid; grid-template-columns: 280px 1fr; height: 100vh; }
        
        /* Barra Lateral de Usuario (Autenticación) */
        .sidebar { background: #161B29; padding: 20px; border-right: 1px solid #2D3748; }
        .user-card { background: #0A0F1D; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--p-gold); }
        
        /* Cartas Fluidas */
        .album-viewport { padding: 40px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
        .card-component { background: #1E293B; border-radius: 8px; padding: 10px; transition: transform 0.1s; }
        .card-component:hover { transform: scale(1.02); }
        .card-img { width: 100%; height: 200px; background: #334155; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div class="app-grid">
    <aside class="sidebar">
        <div id="auth-container" class="user-card">
            <button id="login-btn">Acceder con Google</button>
            <div id="user-profile" style="display:none;">
                <img id="user-photo" width="40" style="border-radius:50%">
                <p id="user-name"></p>
                <button id="logout-btn">Cerrar Sesión</button>
            </div>
        </div>
        <nav>
            <ul style="list-style:none; padding:0;">
                <li><button onclick="renderAll()">Recargar Álbum</button></li>
            </ul>
        </nav>
    </aside>

    <main class="album-viewport" id="album-grid">
        </main>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

    // Firebase Config (Coloca la tuya aquí)
    const firebaseConfig = { /* ... */ };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Renderizado 1000% más rápido mediante DocumentFragment
    function renderAll() {
        const grid = document.getElementById('album-grid');
        const fragment = document.createDocumentFragment();
        
        // Simulación: Generar 50 cartas para testear fluidez
        for(let i=0; i<50; i++) {
            const card = document.createElement('div');
            card.className = 'card-component';
            card.innerHTML = `<div class="card-img">ID: ${i}</div><p>Jugador ${i}</p>`;
            fragment.appendChild(card);
        }
        grid.innerHTML = '';
        grid.appendChild(fragment);
    }

    // Auth Handlers
    document.getElementById('login-btn').onclick = () => signInWithPopup(auth, new GoogleAuthProvider());
    document.getElementById('logout-btn').onclick = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('login-btn').style.display = 'none';
            document.getElementById('user-profile').style.display = 'block';
            document.getElementById('user-name').innerText = user.displayName;
        }
    });

    renderAll();
</script>
</body>
</html>
