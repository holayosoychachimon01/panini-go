<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panini GO · FIFA World Cup 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <style>
    /* ─── Variables ─── */
    :root {
      --blue:   #0033A0;
      --gold:   #FDB913;
      --red:    #e94560;
      --bg:     #07090F;
      --surface:#0E1220;
      --panel:  #141827;
      --border: rgba(253,185,19,0.15);
      --text:   #F0F4FF;
      --muted:  #6B7A99;
      --radius: 12px;
      --sidebar:270px;
    }

    /* ─── Reset ─── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Barlow', sans-serif;
    }

    /* ─── Layout ─── */
    .app {
      display: grid;
      grid-template-columns: var(--sidebar) 1fr;
      grid-template-rows: 1fr;
      height: 100vh;
    }

    /* ─── Sidebar ─── */
    .sidebar {
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    .sidebar::before {
      content: '';
      position: absolute;
      top: -60px; left: -60px;
      width: 220px; height: 220px;
      background: radial-gradient(circle, rgba(253,185,19,0.12), transparent 70%);
      pointer-events: none;
    }

    /* Logo */
    .logo-wrap {
      padding: 22px 20px 16px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }
    .logo-wrap img {
      width: 100%;
      max-width: 180px;
      height: auto;
      filter: drop-shadow(0 0 18px rgba(253,185,19,0.4));
      transition: filter 0.3s;
    }
    .logo-wrap img:hover { filter: drop-shadow(0 0 28px rgba(253,185,19,0.7)); }
    .logo-wrap .tagline {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gold);
      margin-top: 6px;
      opacity: 0.7;
    }

    /* Stats bar */
    .stats-bar {
      display: flex;
      justify-content: space-around;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: rgba(253,185,19,0.03);
    }
    .stat { text-align: center; }
    .stat-num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      color: var(--gold);
      line-height: 1;
    }
    .stat-label {
      font-size: 9px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 2px;
    }

    /* Auth card */
    .auth-card {
      margin: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
    }
    .btn-google {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-family: 'Barlow', sans-serif;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-google:hover { background: #0041cc; transform: translateY(-1px); }
    .btn-google:active { transform: translateY(0); }
    .btn-google svg { flex-shrink: 0; }

    .user-profile { display: none; align-items: center; gap: 10px; }
    .user-profile.active { display: flex; }
    .user-avatar {
      width: 38px; height: 38px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      object-fit: cover;
      flex-shrink: 0;
    }
    .user-info { flex: 1; min-width: 0; }
    .user-name {
      font-weight: 700; font-size: 13px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .btn-logout {
      font-size: 11px; color: var(--muted);
      background: none; border: none; cursor: pointer;
      padding: 0; text-decoration: underline;
      font-family: 'Barlow', sans-serif;
      transition: color 0.2s;
    }
    .btn-logout:hover { color: var(--red); }

    /* Nav / Sección selector */
    .nav-label {
      padding: 8px 16px 4px;
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
    }
    .nav-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
      padding: 4px 10px 10px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
      border: 1px solid transparent;
      margin-bottom: 2px;
    }
    .nav-item:hover { background: rgba(255,255,255,0.04); }
    .nav-item.active {
      background: rgba(253,185,19,0.08);
      border-color: rgba(253,185,19,0.25);
    }
    .nav-icon { font-size: 16px; flex-shrink: 0; width: 22px; text-align: center; }
    .nav-text { flex: 1; min-width: 0; }
    .nav-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.5px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .nav-desc {
      font-size: 9px;
      color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .nav-count {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 14px;
      color: var(--muted);
      flex-shrink: 0;
    }

    /* ─── Main ─── */
    .main {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }

    /* Topbar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 28px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      flex-shrink: 0;
    }
    .topbar-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 26px;
      letter-spacing: 1px;
      line-height: 1;
    }
    .topbar-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }
    .search-box {
      position: relative;
    }
    .search-box input {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 14px 8px 36px;
      font-family: 'Barlow', sans-serif;
      font-size: 13px;
      width: 220px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box input:focus { border-color: rgba(253,185,19,0.5); }
    .search-box input::placeholder { color: var(--muted); }
    .search-icon {
      position: absolute;
      left: 10px; top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    /* Album grid */
    .album-viewport {
      flex: 1;
      overflow-y: auto;
      padding: 24px 28px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 16px;
      align-content: start;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    /* ─── Card ─── */
    .card {
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      transition: transform 0.18s cubic-bezier(.34,1.56,.64,1), box-shadow 0.18s;
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.06);
      animation: fadeUp 0.3s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 12px 32px rgba(0,0,0,0.5);
      z-index: 1;
    }
    .card.owned { border-color: rgba(253,185,19,0.5); }
    .card.owned .card-face { opacity: 1; }
    .card:not(.owned) .card-face { opacity: 0.45; filter: grayscale(0.6); }

    .card-face {
      height: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      position: relative;
      transition: opacity 0.2s, filter 0.2s;
    }
    .card-face::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 40%, rgba(0,0,0,0.55));
    }

    .card-body {
      padding: 8px 10px 10px;
    }
    .card-id {
      font-size: 9px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 2px;
    }
    .card-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 13px;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-owned-badge {
      position: absolute;
      top: 8px; right: 8px;
      width: 20px; height: 20px;
      background: var(--gold);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px;
      z-index: 2;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .card.owned .card-owned-badge { opacity: 1; }

    /* tipo badges */
    .tipo-escudo   { background: linear-gradient(135deg,#1e3a8a,#3b82f6); }
    .tipo-grupal   { background: linear-gradient(135deg,#14532d,#22c55e); }
    .tipo-jugador  { background: linear-gradient(135deg,#1e293b,#334155); }
    .tipo-estadio  { background: linear-gradient(135deg,#0033A0,#FDB913); }
    .tipo-sede     { background: linear-gradient(135deg,#7f1d1d,#ef4444); }
    .tipo-extra    { background: linear-gradient(135deg,#4c1d95,#8b5cf6); }
    .tipo-broma    { background: linear-gradient(135deg,#1a1a2e,#e94560); }

    /* Empty state */
    .empty {
      grid-column: 1/-1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      color: var(--muted);
      gap: 12px;
    }
    .empty-icon { font-size: 48px; }
    .empty-text { font-size: 14px; }

    /* Scrollbar webkit */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  </style>
</head>
<body>

<div class="app">

  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <div class="logo-wrap">
      <img src="World-Cup-2026-Logo.png" alt="FIFA World Cup 2026"
           onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='block'">
      <div id="logo-fallback" style="display:none; font-family:'Bebas Neue',sans-serif; font-size:18px; color:var(--gold);">🏆 FIFA WORLD CUP 2026</div>
      <div class="tagline">Álbum de Stickers Oficial</div>
    </div>

    <div class="stats-bar">
      <div class="stat">
        <div class="stat-num" id="stat-owned">0</div>
        <div class="stat-label">Tengo</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="stat-total">—</div>
        <div class="stat-label">Total</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="stat-pct">0%</div>
        <div class="stat-label">Completo</div>
      </div>
    </div>

    <div class="auth-card">
      <button class="btn-google" id="login-btn">
        <svg width="16" height="16" viewBox="0 0 48 48"><path fill="#fff" d="M43.6 20H24v8h11.3C33.7 33.1 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.1 6.5 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c11 0 19.6-8 19.6-20 0-1.4-.1-2.7-.4-4z"/></svg>
        Acceder con Google
      </button>
      <div class="user-profile" id="user-profile">
        <img class="user-avatar" id="user-photo" src="" alt="Avatar">
        <div class="user-info">
          <div class="user-name" id="user-name">Usuario</div>
          <button class="btn-logout" id="logout-btn">Cerrar sesión</button>
        </div>
      </div>
    </div>

    <div class="nav-label">Secciones</div>
    <ul class="nav-list" id="nav-list"></ul>
  </aside>

  <!-- ── Main ── -->
  <main class="main">
    <div class="topbar">
      <div>
        <div class="topbar-title" id="section-title">FIFA World Cup 2026</div>
        <div class="topbar-sub" id="section-sub">Selecciona una sección en el panel izquierdo</div>
      </div>
      <div class="search-box">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="search-input" placeholder="Buscar carta…">
      </div>
    </div>
    <div class="album-viewport" id="album-grid"></div>
  </main>
</div>

<!-- ── Firebase (versión estable 11.x) ── -->
<script type="module">
  import { initializeApp }            from "https://www.gstatic.com/firebasejs/11.3.1/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
                                       from "https://www.gstatic.com/firebasejs/11.3.1/firebase-auth.js";
  import { SECS, TOTAL_CARDS }        from "./cartas.js";

  // ── Firebase Config — rellena con tus datos ──
  const firebaseConfig = {
    apiKey:            "TU_API_KEY",
    authDomain:        "TU_PROYECTO.firebaseapp.com",
    projectId:         "TU_PROYECTO",
    storageBucket:     "TU_PROYECTO.appspot.com",
    messagingSenderId: "TU_SENDER_ID",
    appId:             "TU_APP_ID"
  };

  // ── Init Firebase (solo si está configurado) ──
  let auth = null;
  const firebaseReady = firebaseConfig.apiKey !== "TU_API_KEY";
  if (firebaseReady) {
    const app = initializeApp(firebaseConfig);
    auth = getAuth(app);
  }

  // ── Estado local ──
  const owned = new Set(JSON.parse(localStorage.getItem("owned") || "[]"));
  let currentSecId = null;
  let searchQuery = "";

  // ── Stats ──
  function updateStats() {
    document.getElementById("stat-owned").textContent = owned.size;
    document.getElementById("stat-total").textContent = TOTAL_CARDS;
    const pct = TOTAL_CARDS > 0 ? Math.round((owned.size / TOTAL_CARDS) * 100) : 0;
    document.getElementById("stat-pct").textContent = pct + "%";
    localStorage.setItem("owned", JSON.stringify([...owned]));
  }

  // ── Nav ──
  function buildNav() {
    const list = document.getElementById("nav-list");
    list.innerHTML = "";
    SECS.forEach(sec => {
      const li = document.createElement("li");
      li.className = "nav-item";
      li.dataset.id = sec.id;
      li.innerHTML = `
        <span class="nav-icon">${sec.icon}</span>
        <span class="nav-text">
          <div class="nav-name">${sec.name}</div>
          <div class="nav-desc">${sec.desc}</div>
        </span>
        <span class="nav-count">${sec.cards.length}</span>
      `;
      li.onclick = () => loadSection(sec.id);
      list.appendChild(li);
    });
  }

  // ── Renderizado de cartas ──
  function loadSection(secId) {
    currentSecId = secId;
    searchQuery = "";
    document.getElementById("search-input").value = "";

    // Active nav
    document.querySelectorAll(".nav-item").forEach(el =>
      el.classList.toggle("active", el.dataset.id === secId));

    const sec = SECS.find(s => s.id === secId);
    if (!sec) return;

    document.getElementById("section-title").textContent = sec.icon + " " + sec.name;
    document.getElementById("section-sub").textContent = sec.desc;

    renderCards(sec);
  }

  function renderCards(sec) {
    const grid = document.getElementById("album-grid");
    const fragment = document.createDocumentFragment();
    const query = searchQuery.toLowerCase();

    const filtered = sec.cards.filter(c =>
      c.name.toLowerCase().includes(query) || c.id.toLowerCase().includes(query)
    );

    grid.innerHTML = "";

    if (filtered.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.innerHTML = `<div class="empty-icon">🔍</div><div class="empty-text">Sin resultados para "${query}"</div>`;
      fragment.appendChild(empty);
      grid.appendChild(fragment);
      return;
    }

    filtered.forEach((carta, i) => {
      const isOwned = owned.has(carta.id);
      const tipo = carta.tipo || "jugador";
      const div = document.createElement("div");
      div.className = "card" + (isOwned ? " owned" : "");
      div.style.animationDelay = `${Math.min(i * 18, 300)}ms`;
      div.innerHTML = `
        <div class="card-face tipo-${tipo}"
             style="background: linear-gradient(135deg, ${sec.color1}, ${sec.color2});">
          <span style="font-size:44px; position:relative; z-index:1;">${sec.icon}</span>
        </div>
        <div class="card-owned-badge">✓</div>
        <div class="card-body">
          <div class="card-id">#${carta.id}</div>
          <div class="card-name">${carta.name}</div>
        </div>
      `;
      div.onclick = () => toggleOwned(carta.id, div, sec);
      fragment.appendChild(div);
    });

    grid.appendChild(fragment);
  }

  function toggleOwned(cardId, el, sec) {
    if (owned.has(cardId)) owned.delete(cardId);
    else owned.add(cardId);
    el.classList.toggle("owned", owned.has(cardId));
    updateStats();
  }

  // ── Búsqueda ──
  document.getElementById("search-input").addEventListener("input", e => {
    searchQuery = e.target.value;
    if (!currentSecId) return;
    const sec = SECS.find(s => s.id === currentSecId);
    if (sec) renderCards(sec);
  });

  // ── Auth ──
  function setUser(user) {
    const loginBtn     = document.getElementById("login-btn");
    const profileEl    = document.getElementById("user-profile");
    const photoEl      = document.getElementById("user-photo");
    const nameEl       = document.getElementById("user-name");

    if (user) {
      loginBtn.style.display = "none";
      profileEl.classList.add("active");
      photoEl.src = user.photoURL || "";
      nameEl.textContent = user.displayName || user.email;
    } else {
      loginBtn.style.display = "flex";
      profileEl.classList.remove("active");
    }
  }

  if (firebaseReady) {
    document.getElementById("login-btn").onclick = () =>
      signInWithPopup(auth, new GoogleAuthProvider()).catch(console.error);
    document.getElementById("logout-btn").onclick = () =>
      signOut(auth).catch(console.error);
    onAuthStateChanged(auth, setUser);
  } else {
    // Sin Firebase configurado: oculta el botón de login y muestra aviso
    document.getElementById("login-btn").textContent = "⚙️ Configura Firebase";
    document.getElementById("login-btn").onclick = () =>
      alert("Edita firebaseConfig en index.html con tus credenciales de Firebase.");
  }

  // ── Arranque ──
  buildNav();
  updateStats();
  // Carga la primera sección por defecto
  if (SECS.length > 0) loadSection(SECS[0].id);
</script>
</body>
</html>
